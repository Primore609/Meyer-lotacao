<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parcial de Vendas · Primore</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090d;--sf:#0d1117;--sf2:#161b22;
  --bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.16);
  --tx:#e6edf3;--mt:#6e7681;--mt2:#8b949e;
  --green:#16a34a;--red:#dc2626;--gold:#ca8a04;--blue:#2563eb;
}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif}
.page{display:flex;flex-direction:column;height:1080px;padding:22px 30px 20px}

/* Header */
.header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--bd);margin-bottom:16px;flex-shrink:0}
.h-left h1{font-size:34px;font-weight:700;letter-spacing:-.5px}
.h-left .meta-row{font-size:13px;color:var(--mt2);margin-top:4px;display:flex;align-items:center;gap:10px}
.badge{background:var(--sf2);border:1px solid var(--bd2);border-radius:6px;padding:3px 12px;font-size:12px;font-weight:600;color:var(--tx);font-family:'DM Mono',monospace}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mt)}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.sdot.ld{background:#b45309;animation:blink .8s infinite}
.sdot.er{background:var(--red)}
.h-right{text-align:right}
.h-right .date{font-size:30px;font-weight:700;font-family:'DM Mono',monospace;letter-spacing:-.5px}
.h-right .wd{font-size:13px;color:var(--mt2);margin-top:3px}

/* KPI */
.kpi-strip{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin-bottom:16px;flex-shrink:0}
.kpi{border-radius:12px;padding:16px 22px;border:1px solid}
.kpi .kn{font-size:44px;font-weight:700;font-family:'DM Mono',monospace;line-height:1;margin-bottom:5px}
.kpi .kl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}
.kpi .ks{font-size:11px;margin-top:3px;opacity:.75}
.kpi-prog{margin-top:10px;height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.kpi-pf{height:100%;border-radius:99px;transition:width .8s}

/* Tables */
.tables-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;flex:1;min-height:0}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;overflow:hidden}
.panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--mt2);margin-bottom:12px;flex-shrink:0}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:600;color:var(--mt);text-align:left;padding:0 8px 8px;border-bottom:1px solid var(--bd);text-transform:uppercase;letter-spacing:.4px}
th:last-child,td:last-child{text-align:right}
td{padding:9px 8px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
tr:last-child td{border-bottom:none}
.nm{font-weight:600;color:var(--tx)}
.qty{font-size:11px;color:var(--mt2);background:var(--sf2);padding:2px 8px;border-radius:99px;font-family:'DM Mono',monospace}
.val{font-weight:700;font-family:'DM Mono',monospace;font-size:15px}
.empty-row{color:var(--mt);font-size:13px;text-align:center;padding:24px 0}
.vdot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:middle}

/* Error */
.err-box{background:rgba(220,38,38,.1);border:1px solid var(--red);border-radius:8px;padding:10px 16px;font-size:12px;color:#fca5a5;margin-bottom:12px;display:none;flex-shrink:0}

/* Countdown */
.countdown{position:fixed;bottom:14px;right:22px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mt);font-family:'DM Mono',monospace}
.ct{width:60px;height:3px;background:var(--bd2);border-radius:99px;overflow:hidden}
.cf{height:100%;background:var(--green);border-radius:99px;transition:width 1s linear}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="h-left">
      <h1>Parcial de Vendas</h1>
      <div class="meta-row">
        <span class="badge" id="cycle-badge">Detectando ciclo…</span>
        <div class="status"><div class="sdot" id="sdot"></div><span id="stxt">Carregando…</span></div>
      </div>
    </div>
    <div class="h-right">
      <div class="date" id="date-el">—</div>
      <div class="wd" id="wd-el">—</div>
    </div>
  </div>

  <div class="err-box" id="err-box"></div>

  <div class="kpi-strip">
    <div class="kpi" style="background:rgba(22,163,74,.08);border-color:var(--green)">
      <div class="kn" id="kpi-total" style="color:var(--green)">R$ —</div>
      <div class="kl" style="color:var(--green)">Total Vendido no Ciclo</div>
      <div class="ks" id="kpi-qtd">— contratos</div>
      <div class="kpi-prog"><div class="kpi-pf" id="kpi-pf" style="width:0%"></div></div>
    </div>
    <div class="kpi" style="background:var(--sf);border-color:var(--bd2)">
      <div class="kn" style="color:var(--mt2)">R$ 1.250.000</div>
      <div class="kl" style="color:var(--mt2)">Meta do Ciclo</div>
      <div class="ks" id="kpi-pct">—% atingido</div>
    </div>
    <div class="kpi" style="background:rgba(220,38,38,.08);border-color:var(--red)">
      <div class="kn" id="kpi-falta" style="color:var(--red)">R$ —</div>
      <div class="kl" style="color:var(--red)">Falta para a Meta</div>
      <div class="ks" id="kpi-falta-sub">—</div>
    </div>
  </div>

  <div class="tables-grid">
    <div class="panel">
      <div class="panel-title">Por SDR</div>
      <table><thead><tr><th>SDR</th><th>Contratos</th><th>Total Vendido</th></tr></thead>
      <tbody id="tbl-sdr"></tbody></table>
    </div>
    <div class="panel">
      <div class="panel-title">Por Consultor</div>
      <table><thead><tr><th>Consultor</th><th>Contratos</th><th>Total Vendido</th></tr></thead>
      <tbody id="tbl-cons"></tbody></table>
    </div>
    <div class="panel">
      <div class="panel-title">Por Espaço</div>
      <table><thead><tr><th>Espaço</th><th>Contratos</th><th>Total Vendido</th></tr></thead>
      <tbody id="tbl-esp"></tbody></table>
    </div>
  </div>

</div>

<div class="countdown">
  <div class="ct"><div class="cf" id="cf" style="width:100%"></div></div>
  <span id="ct-lbl">—</span>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxtVE0dAraFmtqVyknzJmOCWIJp9qYGRAnD-C7Cn4SpKmEnJAmKRs9FOKe_HBVDMznS7g/exec';
const REFRESH = 300;

const DAYS_PT = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const VENUE_COLOR = {
  'meyer':'#16a34a',
  'giardino':'#2563eb',
  'villa domenica':'#ca8a04','villa domênica':'#ca8a04','villa':'#ca8a04'
};
function vcolor(n){return VENUE_COLOR[(n||'').toLowerCase().trim()]||'#8b949e';}

function fmtBRL(v){
  return 'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
}

function updateClock(){
  const n=new Date();
  document.getElementById('date-el').textContent=
    String(n.getDate()).padStart(2,'0')+'/'+String(n.getMonth()+1).padStart(2,'0')+'/'+n.getFullYear();
  document.getElementById('wd-el').textContent=DAYS_PT[n.getDay()];
}

function renderTbl(id,data,colorFn){
  const tbody=document.getElementById(id);
  const entries=Object.entries(data||{}).sort((a,b)=>b[1].t-a[1].t);
  if(!entries.length){
    tbody.innerHTML=`<tr><td colspan="3" class="empty-row">Sem dados no ciclo</td></tr>`;
    return;
  }
  const max=entries[0][1].t;
  tbody.innerHTML=entries.map(([name,d])=>{
    const color=colorFn?colorFn(name):null;
    const dot=color?`<span class="vdot" style="background:${color}"></span>`:'';
    return`<tr>
      <td class="nm">${dot}${name}</td>
      <td><span class="qty">${d.n} contrato${d.n!==1?'s':''}</span></td>
      <td class="val" style="color:${color||'var(--tx)'}">${fmtBRL(d.t)}</td>
    </tr>`;
  }).join('');
}

async function load(){
  const sdot=document.getElementById('sdot');
  const stxt=document.getElementById('stxt');
  const errBox=document.getElementById('err-box');
  sdot.className='sdot ld'; stxt.textContent='Buscando dados…'; errBox.style.display='none';

  try{
    const res=await fetch(SCRIPT_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const d=await res.json();

    if(d.error) throw new Error(d.error);

    // Badge
    document.getElementById('cycle-badge').textContent=d.cycle||'—';

    // KPIs
    document.getElementById('kpi-total').textContent=fmtBRL(d.total||0);
    document.getElementById('kpi-qtd').textContent=`${d.count||0} contrato${d.count!==1?'s':''} no ciclo`;
    document.getElementById('kpi-pct').textContent=`${d.pct||0}% atingido`;
    document.getElementById('kpi-falta').textContent=fmtBRL(d.falta||0);
    document.getElementById('kpi-falta-sub').textContent=
      (d.falta||0)<=0?'🎯 Meta atingida!':'Faltam '+fmtBRL(d.falta||0);
    const pf=document.getElementById('kpi-pf');
    pf.style.width=(d.pct||0)+'%';
    pf.style.background=(d.pct||0)>=100?'var(--gold)':(d.pct||0)>=70?'var(--green)':'var(--blue)';

    // Tables
    renderTbl('tbl-sdr',    d.sdr,      null);
    renderTbl('tbl-cons',   d.consultor, null);
    renderTbl('tbl-esp',    d.espaco,   n=>vcolor(n));

    sdot.className='sdot';
    stxt.textContent=`Atualizado às ${d.updatedAt||'—'}`;

  }catch(e){
    sdot.className='sdot er';
    stxt.textContent='Erro ao carregar';
    errBox.style.display='block';
    errBox.textContent='⚠ '+e.message;
  }
}

// Countdown
let cdT=null, sec=0;
function startCD(){
  if(cdT)clearInterval(cdT);
  sec=REFRESH;
  const cf=document.getElementById('cf'), cl=document.getElementById('ct-lbl');
  cdT=setInterval(()=>{
    sec--;
    cf.style.width=Math.max(0,Math.round(sec/REFRESH*100))+'%';
    const m=Math.floor(sec/60), s=sec%60;
    cl.textContent=m+':'+String(s).padStart(2,'0');
    if(sec<=0){clearInterval(cdT);load().then(startCD);}
  },1000);
}

setInterval(updateClock,1000);
updateClock();
load().then(startCD);
</script>
</body>
</html>
