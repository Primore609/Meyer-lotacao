<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Produção Primore 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07090d;--sf:#0d1117;--bd:rgba(255,255,255,.08);--tx:#e6edf3;--mt:#6e7681;}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);
  color:var(--tx);font-family:'DM Sans',sans-serif;transform-origin:top left;position:absolute;top:0;left:0;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:16px 22px 12px;gap:8px;opacity:0;transition:opacity .5s}
.slide.on{display:flex;opacity:1}
.prog{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,#3b82f6,#8b5cf6);width:0%}
.dots{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .3s}
.dot.on{background:#fff;width:22px;border-radius:99px}
.ctrls{position:fixed;bottom:8px;right:18px;display:flex;gap:6px;z-index:100}
.cb{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#e6edf3;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cb:hover{background:rgba(255,255,255,.2)}
.cb.paused{background:rgba(37,99,235,.3);border-color:rgba(37,99,235,.5)}

/* Stats slide */
.s1-h{font-size:30px;font-weight:700;flex-shrink:0}
#stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex-shrink:0}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px 18px}
.sc-v{font-size:48px;font-weight:700;font-family:'DM Mono',monospace;line-height:1}
.sc-l{font-size:11px;color:var(--mt);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}






/* Calendar slide */
.cal-hdr{flex-shrink:0}
.cal-hdr h1{font-size:26px;font-weight:700}
.legend{display:flex;gap:14px;margin-top:4px}
.leg-i{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mt)}
.leg-d{width:10px;height:10px;border-radius:3px}
.cal-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:6px;flex:1;min-height:0}

/* Month card */
.month-card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;
  padding:8px 10px;display:flex;flex-direction:column;overflow:hidden}
.month-top{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;margin-bottom:4px}
.month-nm{font-size:15px;font-weight:700}
.mbadge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;font-family:'DM Mono',monospace}
.cal-wrap{flex:1;min-height:0;overflow:hidden}
.cal-wrap table{width:100%;border-collapse:separate;border-spacing:2px;table-layout:fixed}
.cal-wrap th{font-size:9px;color:var(--mt);text-align:center;padding:1px 0;text-transform:uppercase;letter-spacing:.3px;font-weight:600;height:16px}
.cal-wrap td{vertical-align:top;padding:0;height:108px}

/* Day cell — equal sections per venue */
.day-cell{display:flex;flex-direction:column;border-radius:4px;height:100%;width:100%;overflow:hidden;border:1px solid transparent}
.day-num-bar{font-size:14px;font-weight:700;padding:2px 4px;flex-shrink:0;text-align:center;font-family:'DM Mono',monospace}
.day-section{flex:1;display:flex;align-items:center;justify-content:center;padding:1px 3px;min-height:0}
.day-evt{font-size:9px;font-weight:600;font-family:'DM Sans',sans-serif;text-align:center;
  line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.day-free{background:rgba(255,255,255,.04);color:rgba(255,255,255,.2)}
.day-empty{visibility:hidden}
</style>
</head>
<body>
<div class="prog" id="prog"></div>

<!-- SLIDE 1: Resumo -->
<div class="slide on" id="slide-0">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
    <div class="s1-h">Produção 2026</div>
    <div id="hoje-badge" style="font-size:15px;font-weight:600;color:var(--mt2);font-family:'DM Mono',monospace"></div>
  </div>
  <!-- KPI row -->
  <div id="kpi-row" style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;flex-shrink:0"></div>
  <!-- Weekly events -->
  <div style="flex:1;min-height:0;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;overflow:hidden">
    <div id="week-title" style="font-size:13px;font-weight:700;color:var(--mt2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;flex-shrink:0"></div>
    <div id="week-list" style="display:flex;flex-direction:column;gap:6px;overflow:hidden;height:calc(100% - 30px)"></div>
  </div>
</div>

<!-- SLIDE 2: Calendário Jul–Dez -->
<div class="slide" id="slide-1">
  <div class="cal-hdr">
    <h1>Calendário 2026 · Julho — Dezembro</h1>
    <div class="legend">
      <div class="leg-i"><div class="leg-d" style="background:#22c55e"></div>Meyer</div>
      <div class="leg-i"><div class="leg-d" style="background:#3b82f6"></div>Giardino</div>
      <div class="leg-i"><div class="leg-d" style="background:#eab308"></div>Villa Domênica</div>
      <div class="leg-i"><div class="leg-d" style="background:linear-gradient(to bottom,#22c55e 33%,#3b82f6 33% 66%,#eab308 66%)"></div>Múltiplos salões</div>
    </div>
  </div>
  <div class="cal-grid" id="cal-2026"></div>
</div>

<div class="dots" id="dots"></div>
<div class="ctrls">
  <button class="cb" onclick="prevSlide()">‹</button>
  <button class="cb" id="pause-btn" onclick="togglePause()">⏸</button>
  <button class="cb" onclick="nextSlide()">›</button>
</div>

const MONTHS=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DOWS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const N=2, SLIDE_SEC=30;
let cur=0,progT=null,psec=0,paused=false;

function go(n){
  cur=((n%N)+N)%N;
  document.querySelectorAll('.slide').forEach((s,i)=>s.className='slide'+(i===cur?' on':''));
  document.querySelectorAll('.dot').forEach((d,i)=>d.className='dot'+(i===cur?' on':''));
  if(!paused)startProg();
}
function startProg(){
  if(paused)return;
  if(progT)clearInterval(progT);
  psec=0;const pb=document.getElementById('prog');
  pb.style.transition='none';pb.style.width='0%';
  setTimeout(()=>{pb.style.transition=`width ${SLIDE_SEC}s linear`;pb.style.width='100%';},50);
  progT=setInterval(()=>{if(paused)return;psec++;if(psec>=SLIDE_SEC){clearInterval(progT);go(cur+1);}},1000);
}
function prevSlide(){go(cur-1);}
function nextSlide(){go(cur+1);}
function togglePause(){
  paused=!paused;
  const btn=document.getElementById('pause-btn');
  if(paused){if(progT)clearInterval(progT);document.getElementById('prog').style.transition='none';btn.textContent='▶';btn.classList.add('paused');}
  else{btn.textContent='⏸';btn.classList.remove('paused');startProg();}
}

function renderStats(){
  const now=new Date();now.setHours(0,0,0,0);
  const todayStr=now.toISOString().slice(0,10);
  const dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const mesesCurt=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  document.getElementById('hoje-badge').textContent=
    `${dias[now.getDay()]}, ${String(now.getDate()).padStart(2,'0')} de ${mesesCurt[now.getMonth()]} ${now.getFullYear()}`;

  // Count ALL events (each venue event = 1, same day in 2 venues = 2 events)
  const mAll=Object.keys(EV.m),gAll=Object.keys(EV.g),vAll=Object.keys(EV.v);
  const allEvs=[...mAll,...gAll,...vAll];
  const total=allEvs.length;
  const exec=allEvs.filter(d=>d<todayStr).length;
  const fut=allEvs.filter(d=>d>todayStr).length;
  const hoje=allEvs.filter(d=>d===todayStr).length;

  // This week: Monday to Sunday
  const dow=now.getDay();
  const monday=new Date(now);monday.setDate(now.getDate()-(dow===0?6:dow-1));
  const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
  const mondayStr=monday.toISOString().slice(0,10);
  const sundayStr=sunday.toISOString().slice(0,10);
  const semana=allEvs.filter(d=>d>=mondayStr&&d<=sundayStr).length;

  // KPI cards
  document.getElementById('kpi-row').innerHTML=[
    {v:total, l:'Total 2026',      sub:'todos os salões',       c:'#e6edf3', bg:'rgba(255,255,255,.04)'},
    {v:exec,  l:'Executados',      sub:'anteriores a hoje',     c:'#86efac', bg:'rgba(34,197,94,.08)'},
    {v:fut,   l:'A Executar',      sub:'futuros a hoje',        c:'#93c5fd', bg:'rgba(59,130,246,.08)'},
    {v:hoje||'—',l:'Hoje',         sub:String(now.getDate()).padStart(2,'0')+'/'+String(now.getMonth()+1).padStart(2,'0'), c:'#fde047', bg:'rgba(253,224,71,.08)'},
    {v:semana||'—',l:'Essa Semana',sub:String(monday.getDate()).padStart(2,'0')+'/'+String(monday.getMonth()+1).padStart(2,'0')+' — '+String(sunday.getDate()).padStart(2,'0')+'/'+String(sunday.getMonth()+1).padStart(2,'0'), c:'#f0abfc', bg:'rgba(192,132,252,.08)'},
  ].map(({v,l,sub,c,bg})=>`<div class="sc" style="background:${bg};border-color:${c}25">
    <div class="sc-v" style="color:${c};font-size:52px">${v}</div>
    <div class="sc-l" style="font-size:12px">${l}</div>
    <div style="font-size:10px;color:var(--mt);margin-top:2px">${sub}</div>
  </div>`).join('');

  // Weekly events list
  const fmtDate=ds=>{const d=new Date(ds+'T12:00:00');return `${dias[d.getDay()].toUpperCase()} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;};
  const VENUE_COLOR={'m':'#22c55e','g':'#3b82f6','v':'#eab308'};
  const VENUE_NAME={'m':'Meyer','g':'Giardino','v':'Villa Domênica'};

  // Gather all days in week with events
  const weekDays=new Map();
  for(let i=0;i<7;i++){
    const dt=new Date(monday);dt.setDate(monday.getDate()+i);
    const ds=dt.toISOString().slice(0,10);
    const dayEvs=[];
    if(EV.m[ds]) dayEvs.push({venue:'m',title:EV.m[ds]});
    if(EV.g[ds]) dayEvs.push({venue:'g',title:EV.g[ds]});
    if(EV.v[ds]) dayEvs.push({venue:'v',title:EV.v[ds]});
    if(dayEvs.length) weekDays.set(ds,dayEvs);
  }

  const weekTitle=document.getElementById('week-title');
  const weekList=document.getElementById('week-list');

  if(weekDays.size===0){
    weekTitle.textContent='Eventos desta semana';
    weekList.innerHTML='<div style="color:var(--mt);font-size:14px;padding:20px 0">Nenhum evento nesta semana.</div>';
  } else {
    weekTitle.textContent=`Eventos desta semana — ${[...weekDays.values()].flat().length} evento(s)`;
    weekList.innerHTML=[...weekDays.entries()].map(([ds,evs])=>{
      const isToday=ds===todayStr;
      const dayLabel=fmtDate(ds);
      const evHtml=evs.map(ev=>`
        <span style="display:inline-flex;align-items:center;gap:5px;margin-right:16px">
          <span style="width:8px;height:8px;border-radius:50%;background:${VENUE_COLOR[ev.venue]};flex-shrink:0"></span>
          <span style="font-size:13px;color:${VENUE_COLOR[ev.venue]};font-weight:600">${VENUE_NAME[ev.venue]}</span>
          <span style="font-size:13px;color:var(--tx)">${ev.title}</span>
        </span>`).join('');
      return`<div style="display:flex;align-items:center;gap:14px;padding:8px 12px;border-radius:8px;background:${isToday?'rgba(253,224,71,.06)':'rgba(255,255,255,.03)'};border:1px solid ${isToday?'rgba(253,224,71,.2)':'var(--bd)'}">
        <div style="min-width:90px;flex-shrink:0">
          <div style="font-size:13px;font-weight:700;color:${isToday?'#fde047':'var(--tx)'};">${dayLabel}</div>
          ${isToday?'<div style="font-size:9px;color:#fde047;font-weight:700;letter-spacing:.5px">HOJE</div>':''}
        </div>
        <div style="flex:1">${evHtml}</div>
      </div>`;
    }).join('');
  }
}

function renderCal(){
  const el=document.getElementById('cal-2026');
  el.innerHTML='';
  for(let mi=6;mi<=11;mi++){
    const fd=new Date(2026,mi,1).getDay();
    const dim=new Date(2026,mi+1,0).getDate();
    let booked=0;
    for(let d=1;d<=dim;d++){
      const ds=`2026-${String(mi+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(EV.m[ds]||EV.g[ds]||EV.v[ds])booked++;
    }
    const avail=dim-booked;
    const bc=avail===0?'background:rgba(239,68,68,.2);color:#f87171':avail<=4?'background:rgba(234,179,8,.2);color:#fbbf24':'background:rgba(34,197,94,.12);color:#4ade80';

    const card=document.createElement('div');card.className='month-card';
    card.innerHTML=`<div class="month-top"><span class="month-nm">${MONTHS[mi]}</span><span class="mbadge" style="${bc}">${avail===0?'Lotado':avail+' livre'+(avail>1?'s':'')}</span></div>`;

    const wrap=document.createElement('div');wrap.className='cal-wrap';
    const tbl=document.createElement('table');
    tbl.innerHTML='<thead><tr>'+DOWS.map(d=>`<th>${d}</th>`).join('')+'</tr></thead>';
    const tbody=document.createElement('tbody');
    let day=1,col=fd,row=document.createElement('tr');

    // Empty leading cells
    for(let i=0;i<fd;i++){const td=document.createElement('td');td.innerHTML='<div class="day-cell day-empty">x</div>';row.appendChild(td);}

    while(day<=dim){
      if(col===7){tbody.appendChild(row);row=document.createElement('tr');col=0;}
      const ds=`2026-${String(mi+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const inM=!!EV.m[ds],inG=!!EV.g[ds],inV=!!EV.v[ds];
      const hasAny=inM||inG||inV;
      const td=document.createElement('td');
      const cell=document.createElement('div');
      cell.className='day-cell'+(hasAny?'':' day-free');

      let html=`<div class="day-num-bar" style="color:${inM?'#4ade80':inG?'#60a5fa':inV?'#fbbf24':'rgba(255,255,255,.2)'}">${day}</div>`;
      if(inM) html+=`<div class="day-section" style="background:rgba(34,197,94,.25)"><span class="day-evt" style="color:#4ade80">${EV.m[ds]}</span></div>`;
      if(inG) html+=`<div class="day-section" style="background:rgba(59,130,246,.25)"><span class="day-evt" style="color:#60a5fa">${EV.g[ds]}</span></div>`;
      if(inV) html+=`<div class="day-section" style="background:rgba(234,179,8,.25)"><span class="day-evt" style="color:#fbbf24">${EV.v[ds]}</span></div>`;
      if(!hasAny) html+=`<div class="day-section"></div>`;

      cell.innerHTML=html;
      if(!hasAny) cell.style.border='1px solid rgba(255,255,255,.05)';
      else cell.style.border='1px solid rgba(255,255,255,.1)';
      td.appendChild(cell);row.appendChild(td);day++;col++;
    }

    // Trailing empty cells
    while(col>0&&col<7){const td=document.createElement('td');td.innerHTML='<div class="day-cell day-empty">x</div>';row.appendChild(td);col++;}
    if(row.children.length)tbody.appendChild(row);

    // Pad to exactly 6 rows
    while(tbody.rows.length<6){
      const r=document.createElement('tr');
      for(let i=0;i<7;i++){const td=document.createElement('td');td.innerHTML='<div class="day-cell day-empty">x</div>';r.appendChild(td);}
      tbody.appendChild(r);
    }

    tbl.appendChild(tbody);wrap.appendChild(tbl);card.appendChild(wrap);el.appendChild(card);
  }
}

function fitScreen(){
  const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
  document.body.style.transform=`scale(${s})`;
  document.body.style.left=((window.innerWidth-1920*s)/2)+'px';
  document.body.style.top=((window.innerHeight-1080*s)/2)+'px';
}
fitScreen();window.addEventListener('resize',fitScreen);

// Build dots
document.getElementById('dots').innerHTML=Array.from({length:N},(_,i)=>`<div class="dot${i===0?' on':''}" onclick="go(${i})" style="cursor:pointer"></div>`).join('');

renderStats();
renderCal();
startProg();
</script>
</body>
</html>
