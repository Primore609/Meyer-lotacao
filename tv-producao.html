<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Produção Primore 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07090d;--sf:#0d1117;--bd:rgba(255,255,255,.08);--tx:#e6edf3;--mt:#6e7681;}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:16px 22px 12px;gap:8px;opacity:0;transition:opacity .5s}
.slide.on{display:flex;opacity:1}
.prog{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,#3b82f6,#8b5cf6);width:0%}
.dots{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .3s}
.dot.on{background:#fff;width:22px;border-radius:99px}
.ctrls{position:fixed;bottom:8px;right:18px;display:flex;gap:6px;z-index:100}
.cb{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#e6edf3;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cb:hover{background:rgba(255,255,255,.2)}
.cb.paused{background:rgba(37,99,235,.3);border-color:rgba(37,99,235,.5)}
#kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;flex-shrink:0}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 18px}
.sc-v{font-size:52px;font-weight:700;font-family:'DM Mono',monospace;line-height:1}
.sc-l{font-size:11px;color:var(--mt);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.cal-hdr{flex-shrink:0}
.cal-hdr h1{font-size:26px;font-weight:700}
.legend{display:flex;gap:14px;margin-top:4px}
.leg-i{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mt)}
.leg-d{width:10px;height:10px;border-radius:3px}
.cal-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:6px;flex:1;min-height:0}
.month-card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;overflow:hidden}
.month-top{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;margin-bottom:4px}
.month-nm{font-size:15px;font-weight:700}
.mbadge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;font-family:'DM Mono',monospace}
.cal-grid-inner{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  grid-template-rows:18px repeat(6,1fr);
  gap:2px;
  height:100%;width:100%;
}
.cal-dh{font-size:9px;color:var(--mt);text-align:center;text-transform:uppercase;letter-spacing:.3px;font-weight:600;display:flex;align-items:center;justify-content:center;}
.day-cell{display:flex;flex-direction:column;border-radius:4px;height:100%;width:100%;overflow:hidden;border:1px solid transparent}
.day-num-bar{font-size:12px;font-weight:700;padding:1px 2px;flex-shrink:0;text-align:center;font-family:'DM Mono',monospace;line-height:1}
.day-section{flex:1;display:flex;align-items:center;justify-content:center;padding:1px 2px;min-height:0;overflow:hidden}
.day-evt{font-size:9px;font-weight:600;font-family:'DM Sans',sans-serif;text-align:center;line-height:1.1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%;display:block}
.day-free{background:rgba(255,255,255,.04);color:rgba(255,255,255,.2)}
.day-empty{visibility:hidden}
</style>
</head>

const N=3,SLIDE_SEC=30;
let cur=0,progT=null,psec=0,paused=false;

function go(n){cur=((n%N)+N)%N;document.querySelectorAll('.slide').forEach((s,i)=>s.className='slide'+(i===cur?' on':''));document.querySelectorAll('.dot').forEach((d,i)=>d.className='dot'+(i===cur?' on':''));if(!paused)startProg();}
function startProg(){if(paused)return;if(progT)clearInterval(progT);psec=0;const pb=document.getElementById('prog');pb.style.transition='none';pb.style.width='0%';setTimeout(()=>{pb.style.transition='width '+SLIDE_SEC+'s linear';pb.style.width='100%';},50);progT=setInterval(()=>{if(paused)return;psec++;if(psec>=SLIDE_SEC){clearInterval(progT);go(cur+1);}},1000);}
function prevSlide(){go(cur-1);}
function nextSlide(){go(cur+1);}
function togglePause(){paused=!paused;const btn=document.getElementById('pause-btn');if(paused){if(progT)clearInterval(progT);document.getElementById('prog').style.transition='none';btn.innerHTML='&#9654;';btn.classList.add('paused');}else{btn.innerHTML='&#9208;';btn.classList.remove('paused');startProg();}}

function cleanT(s){return s.replace(/^\s*\([^)]*\)\s*/,'').trim();}
async function fetchC(id){const u='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(id)+'/events?key='+API_KEY+'&timeMin=2026-01-01T00:00:00-03:00&timeMax=2026-12-31T23:59:59-03:00&singleEvents=true&maxResults=300&fields=items(summary,start)';const r=await fetch(u);if(!r.ok)throw r.status;const d=await r.json();const m={};(d.items||[]).forEach(e=>{const ds=(e.start?.date||e.start?.dateTime||'').slice(0,10);if(ds)m[ds]=cleanT(e.summary||'');});return m;}
async function loadCal(){try{const[mD,gD,vD]=await Promise.all([fetchC(CAL_M),fetchC(CAL_G),fetchC(CAL_V)]);EV={m:mD,g:gD,v:vD};}catch(e){EV={m:Object.assign({},FB_M),g:Object.assign({},FB_G),v:Object.assign({},FB_V)};}renderStats();renderCal();}

function renderStats(){
  const now=new Date();now.setHours(0,0,0,0);
  const td=now.toISOString().slice(0,10);
  const DI=["Dom","Seg","Ter","Qua","Qui","Sex","S\u00e1b"],ME=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  document.getElementById('hoje-badge').textContent=DI[now.getDay()]+', '+String(now.getDate()).padStart(2,'0')+' '+ME[now.getMonth()]+' '+now.getFullYear();
  const mA=Object.keys(EV.m),gA=Object.keys(EV.g),vA=Object.keys(EV.v),all=[...mA,...gA,...vA];
  const tot=all.length,ex=all.filter(d=>d<td).length,fu=all.filter(d=>d>td).length,hj=all.filter(d=>d===td).length;
  const dw=now.getDay(),mo=new Date(now);mo.setDate(now.getDate()-(dw===0?6:dw-1));
  const su=new Date(mo);su.setDate(mo.getDate()+6);
  const ms=mo.toISOString().slice(0,10),ss=su.toISOString().slice(0,10);
  const sem=all.filter(d=>d>=ms&&d<=ss).length;
  document.getElementById('kpi-row').innerHTML=[
    {v:tot,l:'Total 2026',sub:'todos os sal\u00f5es',c:'#e6edf3',bg:'rgba(255,255,255,.04)'},
    {v:ex,l:'Executados',sub:'anteriores a hoje',c:'#86efac',bg:'rgba(34,197,94,.08)'},
    {v:fu,l:'A Executar',sub:'futuros a hoje',c:'#93c5fd',bg:'rgba(59,130,246,.08)'},
    {v:hj||'\u2014',l:'Hoje',sub:String(now.getDate()).padStart(2,'0')+'/'+(now.getMonth()+1),c:'#fde047',bg:'rgba(253,224,71,.08)'},
    {v:sem||'\u2014',l:'Essa Semana',sub:String(mo.getDate()).padStart(2,'0')+'/'+(mo.getMonth()+1)+' \u2014 '+String(su.getDate()).padStart(2,'0')+'/'+(su.getMonth()+1),c:'#f0abfc',bg:'rgba(192,132,252,.08)'},
  ].map(x=>'<div class="sc" style="background:'+x.bg+';border-color:'+x.c+'25"><div class="sc-v" style="color:'+x.c+'">'+x.v+'</div><div class="sc-l">'+x.l+'</div><div style="font-size:10px;color:var(--mt);margin-top:2px">'+x.sub+'</div></div>').join('');
  const VC={m:'#22c55e',g:'#3b82f6',v:'#eab308'},VN={m:'Meyer',g:'Giardino',v:'Villa Dom\u00eanica'};
  const fd=s=>{const d=new Date(s+'T12:00:00');return DI[d.getDay()].toUpperCase()+' '+String(d.getDate()).padStart(2,'0')+'/'+(d.getMonth()+1);};
  const wk=new Map();
  for(let i=0;i<7;i++){const dt=new Date(mo);dt.setDate(mo.getDate()+i);const ds=dt.toISOString().slice(0,10);const evs=[];if(EV.m[ds])evs.push({v:'m',t:EV.m[ds]});if(EV.g[ds])evs.push({v:'g',t:EV.g[ds]});if(EV.v[ds])evs.push({v:'v',t:EV.v[ds]});if(evs.length)wk.set(ds,evs);}
  const tot2=[...wk.values()].flat().length;
  document.getElementById('week-title').textContent='Eventos desta semana \u2014 '+tot2+' evento(s)';
  if(wk.size===0){document.getElementById('week-list').innerHTML='<div style="color:var(--mt);font-size:14px">Nenhum evento esta semana.</div>';return;}
  document.getElementById('week-list').innerHTML=[...wk.entries()].map(([ds,evs])=>{
    const isT=ds===td;
    const evH=evs.map(e=>'<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px"><span style="width:8px;height:8px;border-radius:50%;background:'+VC[e.v]+'"></span><span style="font-size:12px;color:'+VC[e.v]+';font-weight:600">'+VN[e.v]+'</span><span style="font-size:12px;color:var(--tx)">'+e.t+'</span></span>').join('');
    return'<div style="display:flex;align-items:center;gap:14px;padding:7px 12px;border-radius:8px;background:'+(isT?'rgba(253,224,71,.06)':'rgba(255,255,255,.03)')+';border:1px solid '+(isT?'rgba(253,224,71,.2)':'var(--bd)')+'"><div style="min-width:88px;flex-shrink:0"><div style="font-size:13px;font-weight:700;color:'+(isT?'#fde047':'var(--tx)')+'">'+fd(ds)+'</div>'+(isT?'<div style="font-size:9px;color:#fde047;font-weight:700;letter-spacing:.5px">HOJE</div>':'')+'</div><div style="flex:1">'+evH+'</div></div>';
  }).join('');
}

function renderCal(){
  const el=document.getElementById('cal-2026');el.innerHTML='';
  for(let mi=6;mi<=11;mi++){
    const fd=new Date(2026,mi,1).getDay(),dim=new Date(2026,mi+1,0).getDate();
    let bk=0;for(let d=1;d<=dim;d++){const ds='2026-'+String(mi+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');if(EV.m[ds]||EV.g[ds]||EV.v[ds])bk++;}
    const av=dim-bk,bc=av===0?'background:rgba(239,68,68,.2);color:#f87171':av<=4?'background:rgba(234,179,8,.2);color:#fbbf24':'background:rgba(34,197,94,.12);color:#4ade80';
    const card=document.createElement('div');card.className='month-card';
    card.innerHTML='<div class="month-top"><span class="month-nm">'+MONTHS[mi]+'</span><span class="mbadge" style="'+bc+'">'+(av===0?'Lotado':av+' livre'+(av>1?'s':''))+'</span></div>';

    // CSS Grid calendar — 7 cols × 7 rows (1 header + 6 day rows)
    const grid=document.createElement('div');
    grid.className='cal-grid-inner';
    grid.style.flex='1';
    grid.style.minHeight='0';

    // Header row
    DOWS.forEach(d=>{const h=document.createElement('div');h.className='cal-dh';h.textContent=d;grid.appendChild(h);});

    // 42 day cells (6 rows × 7 cols)
    for(let slot=0;slot<42;slot++){
      const dow=slot%7, weekRow=Math.floor(slot/7);
      const dayNum=slot-fd+1;
      const valid=dayNum>=1&&dayNum<=dim;
      const cell=document.createElement('div');

      if(!valid){
        cell.className='day-cell day-empty';
        cell.textContent='x';
      } else {
        const ds='2026-'+String(mi+1).padStart(2,'0')+'-'+String(dayNum).padStart(2,'0');
        const inM=!!EV.m[ds],inG=!!EV.g[ds],inV=!!EV.v[ds],any=inM||inG||inV;
        cell.className='day-cell'+(any?'':' day-free');
        cell.style.border='1px solid '+(any?'rgba(255,255,255,.12)':'rgba(255,255,255,.04)');
        let html='<div class="day-num-bar" style="color:'+(inM?'#4ade80':inG?'#60a5fa':inV?'#fbbf24':'rgba(255,255,255,.2)')+'">'+dayNum+'</div>';
        if(inM)html+='<div class="day-section" style="background:rgba(34,197,94,.22)"><span class="day-evt" style="color:#4ade80">'+EV.m[ds]+'</span></div>';
        if(inG)html+='<div class="day-section" style="background:rgba(59,130,246,.22)"><span class="day-evt" style="color:#60a5fa">'+EV.g[ds]+'</span></div>';
        if(inV)html+='<div class="day-section" style="background:rgba(234,179,8,.22)"><span class="day-evt" style="color:#fbbf24">'+EV.v[ds]+'</span></div>';
        if(!any)html+='<div class="day-section"></div>';
        cell.innerHTML=html;
      }
      grid.appendChild(cell);
    }

    card.appendChild(grid);el.appendChild(card);
  }
}

document.getElementById('dots').innerHTML=Array.from({length:N},(_,i)=>'<div class="dot'+(i===0?' on':'')+'" onclick="go('+i+')" style="cursor:pointer"></div>').join('');
loadCal();
startProg();
setInterval(loadCal,600000);
</script>
