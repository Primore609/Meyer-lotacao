<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parcial de Vendas · Primore</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090d;--sf:#0d1117;--sf2:#161b22;
  --bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.16);
  --tx:#e6edf3;--mt:#6e7681;--mt2:#8b949e;
  --green:#16a34a;--red:#dc2626;--gold:#ca8a04;--blue:#2563eb;
}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif}

.page{display:flex;flex-direction:column;height:1080px;padding:22px 30px 20px}

/* ── Header ── */
.header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--bd);margin-bottom:16px;flex-shrink:0}
.h-left h1{font-size:34px;font-weight:700;letter-spacing:-.5px}
.h-left .cycle{font-size:13px;color:var(--mt2);margin-top:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{background:var(--sf2);border:1px solid var(--bd2);border-radius:6px;padding:3px 12px;font-size:12px;font-weight:600;color:var(--tx);font-family:'DM Mono',monospace}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mt)}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.sdot.ld{background:#b45309;animation:blink .8s infinite}
.sdot.er{background:var(--red)}
.h-right{text-align:right}
.h-right .date{font-size:30px;font-weight:700;font-family:'DM Mono',monospace;letter-spacing:-.5px}
.h-right .wd{font-size:13px;color:var(--mt2);margin-top:3px}

/* ── KPI strip ── */
.kpi-strip{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin-bottom:16px;flex-shrink:0}
.kpi{border-radius:12px;padding:16px 22px;border:1px solid}
.kpi .kn{font-size:44px;font-weight:700;font-family:'DM Mono',monospace;line-height:1;margin-bottom:5px}
.kpi .kl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}
.kpi .ks{font-size:11px;margin-top:3px;opacity:.75}
.kpi-prog{margin-top:10px;height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.kpi-pf{height:100%;border-radius:99px;transition:width .8s}

/* ── Tables grid ── */
.tables-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;flex:1;min-height:0}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;overflow:hidden}
.panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--mt2);margin-bottom:12px;flex-shrink:0}

table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:600;color:var(--mt);text-align:left;padding:0 8px 8px;border-bottom:1px solid var(--bd);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
th:last-child,td:last-child{text-align:right}
td{padding:9px 8px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
tr:last-child td{border-bottom:none}
.nm{font-weight:600;color:var(--tx)}
.qty{font-size:11px;color:var(--mt2);background:var(--sf2);padding:2px 8px;border-radius:99px;font-family:'DM Mono',monospace;white-space:nowrap}
.val{font-weight:700;font-family:'DM Mono',monospace;font-size:15px}
.empty-row{color:var(--mt);font-size:13px;text-align:center;padding:24px 0}
.vdot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:middle;flex-shrink:0}

/* ── Rank bar ── */
.rank-bar{display:inline-block;height:4px;border-radius:99px;margin-left:8px;vertical-align:middle;opacity:.6}

/* ── Error box ── */
.err-box{background:rgba(220,38,38,.1);border:1px solid var(--red);border-radius:8px;padding:12px 16px;font-size:12px;color:#fca5a5;margin-bottom:12px;display:none}

/* ── Countdown ── */
.countdown{position:fixed;bottom:14px;right:22px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mt);font-family:'DM Mono',monospace}
.ct{width:60px;height:3px;background:var(--bd2);border-radius:99px;overflow:hidden}
.cf{height:100%;background:var(--green);border-radius:99px;transition:width 1s linear}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="header">
    <div class="h-left">
      <h1>Parcial de Vendas</h1>
      <div class="cycle">
        <span class="badge" id="cycle-badge">Detectando ciclo…</span>
        <div class="status"><div class="sdot" id="sdot"></div><span id="stxt">Carregando…</span></div>
      </div>
    </div>
    <div class="h-right">
      <div class="date" id="date-el">—</div>
      <div class="wd" id="wd-el">—</div>
    </div>
  </div>

  <!-- Error box -->
  <div class="err-box" id="err-box"></div>

  <!-- KPIs -->
  <div class="kpi-strip">
    <div class="kpi" style="background:rgba(22,163,74,.08);border-color:var(--green)">
      <div class="kn" id="kpi-total" style="color:var(--green)">R$ —</div>
      <div class="kl" style="color:var(--green)">Total Vendido no Ciclo</div>
      <div class="ks" id="kpi-qtd">— contratos</div>
      <div class="kpi-prog"><div class="kpi-pf" id="kpi-pf" style="width:0%;background:var(--green)"></div></div>
    </div>
    <div class="kpi" style="background:var(--sf);border-color:var(--bd2)">
      <div class="kn" style="color:var(--mt2)">R$ 1.250.000</div>
      <div class="kl" style="color:var(--mt2)">Meta do Ciclo</div>
      <div class="ks" id="kpi-pct">—% atingido</div>
    </div>
    <div class="kpi" style="background:rgba(220,38,38,.08);border-color:var(--red)">
      <div class="kn" id="kpi-falta" style="color:var(--red)">R$ —</div>
      <div class="kl" style="color:var(--red)">Falta para a Meta</div>
      <div class="ks" id="kpi-falta-sub">—</div>
    </div>
  </div>

  <!-- Tables -->
  <div class="tables-grid">
    <div class="panel">
      <div class="panel-title">Por SDR</div>
      <table><thead><tr><th>SDR</th><th>Contratos</th><th>Total Vendido</th></tr></thead>
      <tbody id="tbl-sdr"></tbody></table>
    </div>
    <div class="panel">
      <div class="panel-title">Por Consultor</div>
      <table><thead><tr><th>Consultor</th><th>Contratos</th><th>Total Vendido</th></tr></thead>
      <tbody id="tbl-cons"></tbody></table>
    </div>
    <div class="panel">
      <div class="panel-title">Por Espaço</div>
      <table><thead><tr><th>Espaço</th><th>Contratos</th><th>Total Vendido</th></tr></thead>
      <tbody id="tbl-esp"></tbody></table>
    </div>
  </div>

</div>

<div class="countdown">
  <div class="ct"><div class="cf" id="cf" style="width:100%"></div></div>
  <span id="ct-lbl">—</span>
</div>

<script>
// ── Config ──────────────────────────────────────────────────
const SHEET_ID = '13co1MPFmscJBF3f9sr1vYGO2Kpv4CkrE';
const API_KEY  = 'AIzaSyBHu5yPq9Ha6EBo5SQsWDS4OuVPrH7IEFk';
const META     = 1250000;
const REFRESH  = 300;

const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                   'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DAYS_PT   = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira',
                   'Quinta-feira','Sexta-feira','Sábado'];

const VENUE_COLOR = {
  'meyer':'#16a34a',
  'giardino':'#2563eb',
  'villa domenica':'#ca8a04','villa domênica':'#ca8a04','villa':'#ca8a04'
};
function vcolor(name){return VENUE_COLOR[(name||'').toLowerCase().trim()]||'#8b949e';}

// ── Date helpers ─────────────────────────────────────────────
function updateClock(){
  const n=new Date();
  const d=String(n.getDate()).padStart(2,'0');
  const m=String(n.getMonth()+1).padStart(2,'0');
  document.getElementById('date-el').textContent=`${d}/${m}/${n.getFullYear()}`;
  document.getElementById('wd-el').textContent=DAYS_PT[n.getDay()];
}

function getCycleName(){
  const n=new Date(), day=n.getDate(), mo=n.getMonth();
  const sm=day>=20?mo:(mo-1+12)%12;
  const em=(sm+1)%12;
  return`Ciclo ${MONTHS_PT[sm]} e ${MONTHS_PT[em]}`;
}
function getCycleRange(){
  const n=new Date(), day=n.getDate(), mo=n.getMonth(), yr=n.getFullYear();
  let sm,sy,em,ey;
  if(day>=20){sm=mo;sy=yr;em=(mo+1)%12;ey=(mo===11)?yr+1:yr;}
  else{sm=(mo-1+12)%12;sy=(mo===0)?yr-1:yr;em=mo;ey=yr;}
  return`20/${String(sm+1).padStart(2,'0')} → 19/${String(em+1).padStart(2,'0')}`;
}

// ── Currency parser ──────────────────────────────────────────
// Handles "R$ 69,917.80" (US-style thousands with period decimal)
function parseBRL(str){
  if(!str||typeof str!=='string')return 0;
  // Remove R$, spaces, minus sign handling
  let s=str.replace(/R\$\s*/g,'').trim();
  // Remove thousands separators: commas followed by exactly 3 digits
  s=s.replace(/,(?=\d{3}(\D|$))/g,'');
  // Now parse (period = decimal)
  const v=parseFloat(s);
  return isNaN(v)?0:v;
}
function fmtBRL(v){
  return'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
}

// ── Column mapper ────────────────────────────────────────────
function mapCols(headers){
  const m={};
  headers.forEach((h,i)=>{
    if(!h)return;
    const n=h.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/\s+/g,' ').trim();
    if(n==='evento')m.ev=i;
    if(n.includes('espaco')||n.includes('espaco'))m.esp=i;
    if(n.includes('campanha'))m.camp=i;
    if(n.includes('data contrato'))m.dc=i;
    if(n==='sdr')m.sdr=i;
    if(n.startsWith('consultor'))m.cons=i;
    if(n.includes('valor de contrato'))m.val=i;
    else if(n==='valor'&&m.val===undefined)m.val=i;
    if(n.includes('convidados'))m.conv=i;
    if(n.includes('data do evento'))m.dev=i;
  });
  return m;
}

function isCancelled(row,m){
  return ['camp','cons','sdr'].some(k=>{
    const v=(row[m[k]]||'').toUpperCase();
    return v.includes('CANCEL');
  });
}
function isData(row,m){
  const ev=(row[m.ev]||'').trim();
  if(!ev)return false;
  const el=ev.toLowerCase();
  if(el==='evento'||el.startsWith('metas')||el.startsWith('faltam'))return false;
  return true;
}

// ── Aggregate ────────────────────────────────────────────────
function aggregate(rows,m){
  const sdr={},cons={},esp={};
  let total=0,count=0;
  rows.forEach(row=>{
    if(!isData(row,m))return;
    if(isCancelled(row,m))return;
    const val=parseBRL(row[m.val]);
    if(val<=0)return;
    const s=(row[m.sdr]||'').trim();
    const c=(row[m.cons]||'').trim();
    const e=(row[m.esp]||'').trim();
    total+=val; count++;
    if(s){if(!sdr[s])sdr[s]={t:0,n:0};sdr[s].t+=val;sdr[s].n++;}
    if(c){if(!cons[c])cons[c]={t:0,n:0};cons[c].t+=val;cons[c].n++;}
    if(e){if(!esp[e])esp[e]={t:0,n:0};esp[e].t+=val;esp[e].n++;}
  });
  return{sdr,cons,esp,total,count};
}

// ── Render table ─────────────────────────────────────────────
function renderTbl(id,data,maxVal,colorFn){
  const tbody=document.getElementById(id);
  const entries=Object.entries(data).sort((a,b)=>b[1].t-a[1].t);
  if(!entries.length){
    tbody.innerHTML=`<tr><td colspan="3" class="empty-row">Sem dados no ciclo</td></tr>`;
    return;
  }
  tbody.innerHTML=entries.map(([name,d])=>{
    const color=colorFn?colorFn(name):null;
    const dot=color?`<span class="vdot" style="background:${color}"></span>`:'';
    const bar=maxVal?`<span class="rank-bar" style="width:${Math.round(d.t/maxVal*60)}px;background:${color||'var(--mt2)'}"></span>`:'';
    return`<tr>
      <td class="nm">${dot}${name}${bar}</td>
      <td><span class="qty">${d.n} contrato${d.n!==1?'s':''}</span></td>
      <td class="val" style="color:${color||'var(--tx)'}">${fmtBRL(d.t)}</td>
    </tr>`;
  }).join('');
}

// ── Main fetch & render ──────────────────────────────────────
async function load(){
  const sdot=document.getElementById('sdot');
  const stxt=document.getElementById('stxt');
  const errBox=document.getElementById('err-box');
  sdot.className='sdot ld'; stxt.textContent='Buscando dados…'; errBox.style.display='none';

  try{
    // 1. Get sheet list
    const metaUrl=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}`
      +`?key=${API_KEY}&fields=sheets.properties(title,sheetId)`;
    const metaRes=await fetch(metaUrl);
    if(!metaRes.ok){
      const e=await metaRes.json().catch(()=>({}));
      throw new Error((e?.error?.message)||`Erro HTTP ${metaRes.status} ao listar abas`);
    }
    const meta=await metaRes.json();
    const sheets=(meta.sheets||[]).map(s=>s.properties.title);

    // 2. Match current cycle
    const cn=getCycleName();
    document.getElementById('cycle-badge').textContent=cn+' · '+getCycleRange();
    let sheet=sheets.find(s=>s===cn)
      ||sheets.find(s=>s.trim()===cn.trim())
      ||sheets.find(s=>s.toLowerCase()===cn.toLowerCase());
    if(!sheet){
      // fuzzy: both month names present
      const parts=cn.replace('Ciclo ','').split(' e ');
      sheet=sheets.find(s=>parts.every(p=>s.toLowerCase().includes(p.toLowerCase())));
    }
    if(!sheet)throw new Error(`Aba "${cn}" não encontrada. Abas: ${sheets.join(' | ')}`);

    // 3. Fetch rows — sheet name with single quotes for spaces
    const range=`'${sheet}'!A:P`;
    const dataUrl=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/`
      +encodeURIComponent(range)+`?key=${API_KEY}`;
    const dataRes=await fetch(dataUrl);
    if(!dataRes.ok){
      const e=await dataRes.json().catch(()=>({}));
      throw new Error((e?.error?.message)||`Erro HTTP ${dataRes.status} ao buscar dados`);
    }
    const data=await dataRes.json();
    const rows=data.values||[];
    if(!rows.length)throw new Error('Planilha vazia ou sem dados');

    // 4. Find header row
    let hi=0;
    for(let i=0;i<Math.min(6,rows.length);i++){
      if((rows[i]||[]).some(c=>(c||'').toLowerCase().trim()==='evento')){hi=i;break;}
    }
    const cm=mapCols(rows[hi]||[]);
    const dataRows=rows.slice(hi+1);

    // 5. Aggregate
    const agg=aggregate(dataRows,cm);
    const{sdr,cons,esp,total,count}=agg;

    // 6. KPIs
    const pct=total>0?Math.min(100,Math.round(total/META*100)):0;
    const falta=Math.max(0,META-total);
    document.getElementById('kpi-total').textContent=fmtBRL(total);
    document.getElementById('kpi-qtd').textContent=`${count} contrato${count!==1?'s':''} no ciclo`;
    document.getElementById('kpi-pct').textContent=`${pct}% atingido`;
    document.getElementById('kpi-falta').textContent=fmtBRL(falta);
    document.getElementById('kpi-falta-sub').textContent=falta<=0?'🎯 Meta atingida!':`Faltam ${fmtBRL(falta)}`;
    const pf=document.getElementById('kpi-pf');
    pf.style.width=pct+'%';
    pf.style.background=pct>=100?'var(--gold)':pct>=70?'var(--green)':'var(--blue)';

    // 7. Tables
    const maxSdr=Math.max(...Object.values(sdr).map(x=>x.t),1);
    const maxCons=Math.max(...Object.values(cons).map(x=>x.t),1);
    const maxEsp=Math.max(...Object.values(esp).map(x=>x.t),1);
    renderTbl('tbl-sdr',sdr,maxSdr,null);
    renderTbl('tbl-cons',cons,maxCons,null);
    renderTbl('tbl-esp',esp,maxEsp,n=>vcolor(n));

    // 8. Status
    sdot.className='sdot';
    const hm=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    stxt.textContent=`Atualizado às ${hm}`;

  }catch(e){
    sdot.className='sdot er';
    stxt.textContent='Erro ao carregar';
    errBox.style.display='block';
    errBox.textContent='⚠ '+e.message;
    console.error(e);
  }
}

// ── Countdown ────────────────────────────────────────────────
let cdT=null,sec=0;
function startCD(){
  if(cdT)clearInterval(cdT);
  sec=REFRESH;
  const cf=document.getElementById('cf'),cl=document.getElementById('ct-lbl');
  cdT=setInterval(()=>{
    sec--;
    cf.style.width=Math.max(0,Math.round(sec/REFRESH*100))+'%';
    const m=Math.floor(sec/60),s=sec%60;
    cl.textContent=m+':'+String(s).padStart(2,'0');
    if(sec<=0){clearInterval(cdT);load().then(startCD);}
  },1000);
}

// ── Init ─────────────────────────────────────────────────────
setInterval(updateClock,1000);
updateClock();
load().then(startCD);
</script>
</body>
</html>
