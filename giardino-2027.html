<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIARDINO 2027</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090d;--sf:#0d1117;--bd:rgba(255,255,255,.08);
  --tx:#e6edf3;--mt:#6e7681;
}
html,body{
  width:100vw;height:100vh;overflow:hidden;
  background:var(--bg);color:var(--tx);
  font-family:'DM Sans',sans-serif;
}

/* Full-screen layout — no fixed pixel sizes */
.page{
  display:flex;width:100vw;height:100vh;
  padding:0.4vh 0.3vw;gap:0.3vw;
}

/* Side labels */
.side{
  width:2.8vw;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;
}
.side-label{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;height:100%;
}
.side-letter{
  font-size:clamp(14px, 2.2vh, 32px);
  font-weight:700;color:rgba(255,255,255,.35);
  text-transform:uppercase;line-height:1.1;
  user-select:none;
}

/* Calendar grid — 4 cols × 3 rows */
.cal-grid{
  flex:1;display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:0.4vw 0.4vw;
  min-width:0;min-height:0;
}

/* Month card */
.month-card{
  background:var(--sf);border:1px solid var(--bd);
  border-radius:0.5vw;padding:0.5vh 0.5vw;
  display:flex;flex-direction:column;
  min-height:0;overflow:hidden;
}
.month-header{
  display:flex;justify-content:space-between;
  align-items:center;flex-shrink:0;margin-bottom:0.3vh;
}
.month-name{
  font-size:clamp(10px,1.4vh,18px);
  font-weight:700;letter-spacing:.2px;
}
.month-badge{
  font-size:clamp(8px,1vh,13px);font-weight:600;
  padding:0.1vh 0.5vw;border-radius:99px;
  font-family:'DM Mono',monospace;
}
.badge-g{background:rgba(22,163,74,.15);color:#4ade80;}
.badge-a{background:rgba(217,119,6,.15);color:#fb923c;}
.badge-f{background:rgba(255,255,255,.05);color:var(--mt);}

/* Calendar table — fills card */
.cal{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;}
.cal table{
  width:100%;height:100%;
  border-collapse:separate;
  border-spacing:clamp(1px,0.2vw,3px);
  table-layout:fixed;
}
.cal th{
  font-size:clamp(7px,0.9vh,11px);font-weight:600;
  color:var(--mt);text-align:center;
  text-transform:uppercase;letter-spacing:.3px;
  padding-bottom:0.2vh;
}
.cal td{
  text-align:center;padding:0;
  vertical-align:middle;height:1%;
}

/* Day chip — fully responsive */
.chip{
  display:inline-flex;align-items:center;justify-content:center;
  width:100%;height:100%;
  border-radius:clamp(3px,0.3vw,6px);
  font-size:clamp(9px,1.4vh,18px);
  font-weight:700;font-family:'DM Mono',monospace;
  cursor:default;position:relative;
}
.chip:hover{opacity:.85;z-index:5;}
.chip[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;
  bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
  background:#1e2d3d;color:var(--tx);
  font-size:clamp(8px,0.9vh,11px);
  padding:0.3vh 0.6vw;border-radius:4px;white-space:nowrap;
  border:1px solid rgba(255,255,255,.15);z-index:20;
  font-family:'DM Sans',sans-serif;pointer-events:none;
}
.chip.g3{background:#14532d;color:#4ade80;}
.chip.am{background:#431407;color:#fb923c;}
.chip.rd{background:#450a0a;color:#f87171;}
.chip.bk{background:var(--sf);color:var(--mt);border:1px dashed rgba(255,255,255,.07);}
.chip.em{visibility:hidden;}
</style>
</head>
<body>
<div class="page">
  <div class="side">
    <div class="side-label" id="lbl-left"></div>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="side">
    <div class="side-label" id="lbl-right"></div>
  </div>
</div>
<script>
const YEAR=2027;
const VENUE='GIARDINO';
const MONTHS=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DOW=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const CAL_ID="c_i9jh05ostkk3vmglbjlh7dtb8g@group.calendar.google.com";
const API_KEY="AIzaSyBfQXCnDP3FzBWJ2yJSwwthMScA-otOqiQ";
const REAL_EVENTS=[{"date": "2027-01-29", "title": "Stephany e João Lucas"}, {"date": "2027-01-30", "title": "Isabela e Andress"}, {"date": "2027-02-21", "title": "Tatiane e Isaias"}, {"date": "2027-03-21", "title": "Izabela & Herberet"}, {"date": "2027-03-28", "title": "Manuela & Wellington"}, {"date": "2027-04-09", "title": "Victoria & William"}, {"date": "2027-04-11", "title": "Ellen e Anderson"}, {"date": "2027-04-25", "title": "Helen e Jhonatan"}, {"date": "2027-05-01", "title": "Maria Clara & Bruno"}, {"date": "2027-05-02", "title": "Tatiana e Augusto"}, {"date": "2027-05-08", "title": "Maria Claudia & Valter"}, {"date": "2027-05-14", "title": "Tamara & Lucas"}, {"date": "2027-05-21", "title": "Karen e Victor"}, {"date": "2027-05-28", "title": "Fernanda e Bruno"}, {"date": "2027-06-06", "title": "Nayara & Leandro"}, {"date": "2027-06-19", "title": "Henrique & Roberto"}, {"date": "2027-06-25", "title": "Karoline & Igor"}, {"date": "2027-07-17", "title": "Dayana & Ewerton"}, {"date": "2027-07-24", "title": "Nanda e Isa"}, {"date": "2027-08-05", "title": "Gabrielle & Matheus"}, {"date": "2027-08-13", "title": "Camila e Mateus"}, {"date": "2027-09-04", "title": "Carla & João Victor"}, {"date": "2027-09-19", "title": "Janine & Daniel"}, {"date": "2027-10-10", "title": "Camila & Rodrigo"}];

// Build side labels letter by letter
function buildLabel(el, text){
  el.innerHTML=text.split('').map(c=>`<span class="side-letter">${c}</span>`).join('');
}
buildLabel(document.getElementById('lbl-left'),  VENUE);
buildLabel(document.getElementById('lbl-right'), String(YEAR));

function buildBookedMap(items){
  const bym=Array.from({length:12},()=>new Map());
  (items||[]).forEach(ev=>{
    const ds=(ev.start?.date||ev.start?.dateTime||ev.date||'').slice(0,10);
    if(!ds)return;
    const d=new Date(ds+'T12:00:00');
    if(d.getFullYear()===YEAR)bym[d.getMonth()].set(d.getDate(),ev.title||ev.summary||'');
  });
  return bym;
}

function chipCls(avail,booked){
  if(booked)return'bk';
  if(avail>=3)return'g3';
  if(avail===2)return'am';
  return'rd';
}

function render(bym){
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  MONTHS.forEach((name,mi)=>{
    const bmap=bym[mi];
    const firstDow=new Date(YEAR,mi,1).getDay();
    const dim=new Date(YEAR,mi+1,0).getDate();
    const dowDays=Array.from({length:7},()=>[]);
    for(let d=1;d<=dim;d++) dowDays[new Date(YEAR,mi,d).getDay()].push(d);
    const sold=[...bmap.keys()].length;
    const avail=dim-sold;
    const ratio=sold/dim;
    let bc,bt;
    if(avail===0){bc='badge-f';bt='Lotado';}
    else if(ratio>=.5){bc='badge-a';bt=avail+' livre'+(avail>1?'s':'');}
    else{bc='badge-g';bt=avail+' livre'+(avail>1?'s':'');}

    const card=document.createElement('div');
    card.className='month-card';
    card.innerHTML=`<div class="month-header"><span class="month-name">${name}</span><span class="month-badge ${bc}">${bt}</span></div>`;

    const cal=document.createElement('div');cal.className='cal';
    const tbl=document.createElement('table');
    tbl.innerHTML='<thead><tr>'+DOW.map(d=>`<th>${d}</th>`).join('')+'</tr></thead>';
    const tbody=document.createElement('tbody');
    let day=1,col=firstDow,row=document.createElement('tr');
    for(let i=0;i<firstDow;i++){const td=document.createElement('td');td.innerHTML='<span class="chip em">·</span>';row.appendChild(td);}
    while(day<=dim){
      if(col===7){tbody.appendChild(row);row=document.createElement('tr');col=0;}
      const dow=new Date(YEAR,mi,day).getDay();
      const availInDow=dowDays[dow].filter(d=>!bmap.has(d)).length;
      const isBooked=bmap.has(day);
      const title=bmap.get(day)||'';
      const cls=chipCls(availInDow,isBooked);
      const td=document.createElement('td');
      const chip=document.createElement('span');
      chip.className='chip '+cls;chip.textContent=day;
      if(isBooked&&title)chip.setAttribute('data-tip',title);
      td.appendChild(chip);row.appendChild(td);day++;col++;
    }
    while(col>0&&col<7){const td=document.createElement('td');td.innerHTML='<span class="chip em">·</span>';row.appendChild(td);col++;}
    if(row.children.length)tbody.appendChild(row);
    tbl.appendChild(tbody);cal.appendChild(tbl);card.appendChild(cal);grid.appendChild(card);
  });
}

async function load(){
  const tMin=YEAR+'-01-01T00:00:00-03:00',tMax=YEAR+'-12-31T23:59:59-03:00';
  const url='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(CAL_ID)+'/events?key='+API_KEY+'&timeMin='+tMin+'&timeMax='+tMax+'&singleEvents=true&maxResults=250&fields=items(summary,start)';
  try{
    const res=await fetch(url);
    if(!res.ok)throw new Error(res.status);
    const data=await res.json();
    render(buildBookedMap(data.items));
  }catch(e){render(buildBookedMap(REAL_EVENTS));}
  setTimeout(load,600000);
}

render(buildBookedMap(REAL_EVENTS));
load();
</script>
</body>
</html>
