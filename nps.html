<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>NPS — Primore Eventos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090d;--sf:#0d1117;--sf2:#161b22;
  --bd:rgba(255,255,255,.08);--tx:#e6edf3;--mt:#6e7681;--mt2:#8b949e;
  --green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;
  --purple:#a855f7;
}
html,body{min-height:100vh;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;}
body{padding:24px 32px;max-width:1600px;margin:0 auto;}

/* Header */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;}
.hdr h1{font-size:32px;font-weight:700;letter-spacing:-.5px;}
.hdr-sub{font-size:13px;color:var(--mt2);margin-top:4px;}
.badge{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--mt2);}

/* NPS Score Big */
.nps-hero{display:grid;grid-template-columns:auto 1fr;gap:24px;margin-bottom:24px;align-items:center;}
.nps-score-box{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:28px 36px;text-align:center;min-width:200px;}
.nps-number{font-size:80px;font-weight:700;font-family:'DM Mono',monospace;line-height:1;}
.nps-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-top:6px;}
.nps-class{font-size:13px;color:var(--mt2);margin-top:4px;}

/* Gauge bar */
.gauge-wrap{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:24px;}
.gauge-title{font-size:13px;font-weight:700;color:var(--mt2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px;}
.gauge-bar{display:flex;height:28px;border-radius:8px;overflow:hidden;gap:2px;}
.gauge-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.9);border-radius:4px;transition:flex .6s;}
.gauge-legend{display:flex;gap:20px;margin-top:12px;}
.gl-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mt2);}
.gl-dot{width:10px;height:10px;border-radius:50%;}
.gl-count{font-weight:700;color:var(--tx);font-family:'DM Mono',monospace;}

/* Category grid */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:24px;}
.cat-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;}
.cat-name{font-size:12px;font-weight:600;color:var(--mt2);margin-bottom:10px;line-height:1.3;}
.cat-score{font-size:34px;font-weight:700;font-family:'DM Mono',monospace;}
.cat-bar{height:6px;background:var(--sf2);border-radius:99px;margin-top:8px;overflow:hidden;}
.cat-fill{height:100%;border-radius:99px;transition:width .8s;}
.cat-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--mt);margin-top:4px;}

/* Recent responses */
.recent-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.recent-hdr h2{font-size:16px;font-weight:700;}
.responses{display:flex;flex-direction:column;gap:8px;}
.resp-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;}
.resp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.resp-name{font-size:14px;font-weight:600;}
.resp-date{font-size:11px;color:var(--mt);}
.resp-score-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.resp-score{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;}
.resp-comment{font-size:12px;color:var(--mt2);line-height:1.5;font-style:italic;border-left:2px solid var(--bd);padding-left:10px;}

/* Status */
#status{text-align:center;padding:60px;color:var(--mt);}
.err{color:var(--red);}

/* Two columns layout */
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:900px){.bottom{grid-template-columns:1fr;}.nps-hero{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>📊 NPS — Primore Eventos</h1>
    <div class="hdr-sub">Pesquisa de Satisfação do Cliente · atualizado a cada 5 min</div>
  </div>
  <span class="badge" id="updated">carregando...</span>
</div>

<div id="app"><div id="status">Carregando respostas...</div></div>

<script>
// ── Configuração ───────────────────────────────────────────
// Cole aqui o link do Apps Script após implantar:
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8sepA3IGibYliGW9SEHqJS9Wlp0C7xTvj-Po3ec1T_0SuKDCJVXSoEbJhGW-WNLJw/exec';

// Categorias do formulário (na ordem das colunas do Monday)
const CATS = [
  { key: 'recomend', label: 'Recomendação ao amigo' },
  { key: 'atendimento', label: 'Atendimento da equipe' },
  { key: 'confort', label: 'Conforto e infraestrutura' },
  { key: 'buffet', label: 'Serviço de buffet' },
  { key: 'coquetela', label: 'Coquetelaria' },
  { key: 'decora', label: 'Decoração' },
  { key: 'produ', label: 'Equipe de produção Primore' },
  { key: 'boate', label: 'Empresa de Boate (DJ)' },
];

// ── NPS Calculation (escala 0-5) ───────────────────────────
// Promotores: 4-5 | Neutros: 3 | Detratores: 0-2
function calcNPS(scores) {
  if (!scores.length) return { nps: 0, p: 0, n: 0, d: 0 };
  const p = scores.filter(s => s >= 4).length;
  const ne = scores.filter(s => s === 3).length;
  const d = scores.filter(s => s <= 2).length;
  const nps = Math.round((p - d) / scores.length * 100);
  return { nps, p, n: ne, d, total: scores.length };
}

function npsColor(nps) {
  if (nps >= 75) return '#22c55e';
  if (nps >= 50) return '#3b82f6';
  if (nps >= 0)  return '#eab308';
  return '#ef4444';
}

function npsClass(nps) {
  if (nps >= 75) return 'Excelente';
  if (nps >= 50) return 'Muito Bom';
  if (nps >= 0)  return 'Bom';
  if (nps >= -25)return 'Ruim';
  return 'Crítico';
}

function scoreColor(s) {
  if (s >= 4) return '#22c55e';
  if (s === 3) return '#eab308';
  return '#ef4444';
}

function matchCat(colTitle, catKey) {
  const t = colTitle.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return t.includes(catKey);
}

// ── Render ──────────────────────────────────────────────────
function render(data) {
  if (data.error) {
    document.getElementById('app').innerHTML = `<div id="status" class="err">⚠ ${data.error}</div>`;
    return;
  }

  document.getElementById('updated').textContent = 'Atualizado: ' + data.updatedAt;

  const respostas = data.respostas || [];
  if (!respostas.length) {
    document.getElementById('app').innerHTML = '<div id="status">Nenhuma resposta ainda.</div>';
    return;
  }

  // Discover column names from first response
  const firstScores = respostas[0]._scores || [];
  const colNames = firstScores.map(s => s.cat);

  // Map each category key to actual column name
  function findCol(catKey) {
    return colNames.find(c => c.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(catKey)) || null;
  }

  // Main NPS: first star column (recomendação)
  const mainCol = findCol('recomend') || (colNames[0] || null);
  const mainScores = respostas.map(r => {
    const s = r._scores?.find(x => x.cat === mainCol);
    return s ? s.score : null;
  }).filter(x => x !== null);

  const { nps, p, n, d, total } = calcNPS(mainScores);
  const color = npsColor(nps);

  // Category averages
  const catData = CATS.map(cat => {
    const col = findCol(cat.key);
    if (!col) return null;
    const vals = respostas.map(r => r._scores?.find(x => x.cat === col)?.score).filter(x => x != null);
    const avg = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
    return { ...cat, col, avg: Math.round(avg*10)/10, vals };
  }).filter(Boolean);

  // Recent comments
  const commentCol = Object.keys(respostas[0]).find(k =>
    !['evento','data','_scores'].includes(k) &&
    k.toLowerCase().includes('gost') || k.toLowerCase().includes('melho') || k.toLowerCase().includes('compartilh')
  );

  const recent = [...respostas].reverse().slice(0, 6);

  document.getElementById('app').innerHTML = `
    <!-- Hero NPS -->
    <div class="nps-hero">
      <div class="nps-score-box">
        <div class="nps-number" style="color:${color}">${nps}</div>
        <div class="nps-label" style="color:${color}">NPS</div>
        <div class="nps-class">${npsClass(nps)}</div>
      </div>
      <div class="gauge-wrap">
        <div class="gauge-title">Distribuição de ${total} resposta${total>1?'s':''} · nota: recomendação (0–5)</div>
        <div class="gauge-bar">
          <div class="gauge-seg" style="background:#ef4444;flex:${d||0.01}" title="Detratores ${d}">${d>0?d:''}</div>
          <div class="gauge-seg" style="background:#eab308;flex:${n||0.01}" title="Neutros ${n}">${n>0?n:''}</div>
          <div class="gauge-seg" style="background:#22c55e;flex:${p||0.01}" title="Promotores ${p}">${p>0?p:''}</div>
        </div>
        <div class="gauge-legend">
          <div class="gl-item"><div class="gl-dot" style="background:#22c55e"></div>Promotores (4–5): <span class="gl-count">${p}</span></div>
          <div class="gl-item"><div class="gl-dot" style="background:#eab308"></div>Neutros (3): <span class="gl-count">${n}</span></div>
          <div class="gl-item"><div class="gl-dot" style="background:#ef4444"></div>Detratores (0–2): <span class="gl-count">${d}</span></div>
        </div>
      </div>
    </div>

    <!-- Categories -->
    <div class="cats">
      ${catData.map(cat => {
        const pct = cat.avg / 5 * 100;
        const c = cat.avg >= 4 ? '#22c55e' : cat.avg >= 3 ? '#eab308' : '#ef4444';
        return `<div class="cat-card">
          <div class="cat-name">${cat.label}</div>
          <div class="cat-score" style="color:${c}">${cat.avg.toFixed(1)}<span style="font-size:16px;color:var(--mt)"> /5</span></div>
          <div class="cat-bar"><div class="cat-fill" style="width:${pct}%;background:${c}"></div></div>
          <div class="cat-meta"><span>${cat.vals.length} avaliações</span><span>${Math.round(pct)}%</span></div>
        </div>`;
      }).join('')}
    </div>

    <!-- Recent responses -->
    <div class="recent-hdr"><h2>Últimas Respostas</h2><span style="font-size:12px;color:var(--mt)">${total} total</span></div>
    <div class="responses">
      ${recent.map(r => {
        const scoreItems = (r._scores||[]).map(s => {
          const c = scoreColor(s.score);
          return `<span class="resp-score" style="background:${c}22;color:${c}">${s.cat.substring(0,15)}: ${s.score}</span>`;
        }).join('');
        const comment = commentCol ? r[commentCol] : '';
        return `<div class="resp-card">
          <div class="resp-top">
            <span class="resp-name">${r.evento||'—'}</span>
            <span class="resp-date">${r.data||''}</span>
          </div>
          <div class="resp-score-row">${scoreItems}</div>
          ${comment ? `<div class="resp-comment">${comment}</div>` : ''}
        </div>`;
      }).join('')}
    </div>
  `;
}

// ── Load ────────────────────────────────────────────────────
async function load() {
  try {
    const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
    const data = await res.json();
    render(data);
  } catch(e) {
    document.getElementById('app').innerHTML =
      `<div id="status" class="err">⚠ Erro ao carregar dados.<br>Verifique se o SCRIPT_URL está configurado.<br><small>${e.message}</small></div>`;
  }
}

load();
setInterval(load, 300000); // atualiza a cada 5 min
</script>
</body>
</html>
