<meta charset="UTF-8">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090d;--sf:#0d1117;--sf2:#161b22;
  --bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.16);
  --tx:#e6edf3;--mt:#6e7681;--mt2:#8b949e;
}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:'DM Sans',sans-serif;transform-origin:top left;}

/* Auto-scale for TV */
body{position:absolute;top:0;left:0;}

.page{display:flex;width:1920px;height:1080px;padding:6px;gap:6px;}

/* Side labels */
.side{width:80px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:4px 0;}
.side-label{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0px;height:100%;
}
.side-letter{
  font-size:52px;font-weight:700;
  color:rgba(255,255,255,.45);text-transform:uppercase;
  font-family:'DM Sans',sans-serif;line-height:1;
  user-select:none;letter-spacing:0;
}


/* Calendar grid: 4 cols x 3 rows */
.cal-grid{
  flex:1;display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:5px;min-width:0;min-height:0;
}

/* Month card */
.month-card{
  background:var(--sf);border:1px solid var(--bd);border-radius:8px;
  padding:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.month-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:6px;flex-shrink:0;
}
.month-name{font-size:14px;font-weight:700;letter-spacing:.3px;}
.month-badge{
  font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;
  font-family:'DM Mono',monospace;
}
.badge-g{background:rgba(22,163,74,.15);color:#4ade80;}
.badge-a{background:rgba(217,119,6,.15);color:#fb923c;}
.badge-f{background:rgba(255,255,255,.05);color:var(--mt);}

/* Calendar table */
.cal{flex:1;min-height:0;overflow:hidden;}
.cal table{width:100%;border-collapse:separate;border-spacing:2px;table-layout:fixed;}
.cal th{font-size:9px;font-weight:600;color:var(--mt);text-align:center;
  padding-bottom:3px;text-transform:uppercase;letter-spacing:.4px;}
.cal td{text-align:center;padding:0;vertical-align:middle;}

/* Day chips */
.chip{
  display:inline-flex;align-items:center;justify-content:center;
  width:100%;aspect-ratio:1;border-radius:5px;
  font-size:13px;font-weight:600;font-family:'DM Mono',monospace;
  cursor:default;position:relative;transition:transform .1s;
  max-width:38px;max-height:38px;
}
.chip:hover{transform:scale(1.15);z-index:5;}
.chip.g3{background:#14532d;color:#4ade80;}
.chip.am{background:#431407;color:#fb923c;}
.chip.rd{background:#450a0a;color:#f87171;}
.chip.bk{background:var(--sf2);color:var(--mt);border:1px dashed rgba(255,255,255,.08);}
.chip.em{visibility:hidden;}
.chip[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;
  transform:translateX(-50%);background:#1e2d3d;color:var(--tx);
  font-size:10px;padding:4px 8px;border-radius:4px;white-space:nowrap;
  border:1px solid var(--bd2);z-index:20;font-family:'DM Sans',sans-serif;pointer-events:none;
}
</style>
</head>

function buildBookedMap(items){
  const bym=Array.from({length:12},()=>new Map());
  (items||[]).forEach(ev=>{
    const ds=(ev.start?.date||ev.start?.dateTime||ev.date||'').slice(0,10);
    if(!ds)return;
    const d=new Date(ds+'T12:00:00');
    if(d.getFullYear()===YEAR)bym[d.getMonth()].set(d.getDate(),ev.title||ev.summary||'');
  });
  return bym;
}

function chipCls(avail,booked){
  if(booked)return'bk';
  if(avail>=3)return'g3';
  if(avail===2)return'am';
  return'rd';
}

function render(bym){
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  MONTHS.forEach((name,mi)=>{
    const bmap=bym[mi];
    const firstDow=new Date(YEAR,mi,1).getDay();
    const dim=new Date(YEAR,mi+1,0).getDate();
    const dowDays=Array.from({length:7},()=>[]);
    for(let d=1;d<=dim;d++) dowDays[new Date(YEAR,mi,d).getDay()].push(d);
    const sold=[...bmap.keys()].length;
    const avail=dim-sold;
    const ratio=sold/dim;
    let bc,bt;
    if(avail===0){bc='badge-f';bt='Lotado';}
    else if(ratio>=.5){bc='badge-a';bt=avail+' livre'+(avail>1?'s':'');}
    else{bc='badge-g';bt=avail+' livre'+(avail>1?'s':'');}

    const card=document.createElement('div');
    card.className='month-card';
    card.innerHTML=`<div class="month-header"><span class="month-name">${name}</span><span class="month-badge ${bc}">${bt}</span></div>`;

    const cal=document.createElement('div');cal.className='cal';
    const tbl=document.createElement('table');
    tbl.innerHTML='<thead><tr>'+DOW.map(d=>`<th>${d}</th>`).join('')+'</tr></thead>';
    const tbody=document.createElement('tbody');
    let day=1,col=firstDow,row=document.createElement('tr');
    for(let i=0;i<firstDow;i++){const td=document.createElement('td');td.innerHTML='<span class="chip em">·</span>';row.appendChild(td);}
    while(day<=dim){
      if(col===7){tbody.appendChild(row);row=document.createElement('tr');col=0;}
      const dow=new Date(YEAR,mi,day).getDay();
      const availInDow=dowDays[dow].filter(d=>!bmap.has(d)).length;
      const isBooked=bmap.has(day);
      const title=bmap.get(day)||'';
      const cls=chipCls(availInDow,isBooked);
      const td=document.createElement('td');
      const chip=document.createElement('span');
      chip.className='chip '+cls;
      chip.textContent=day;
      if(isBooked&&title)chip.setAttribute('data-tip',title);
      td.appendChild(chip);row.appendChild(td);day++;col++;
    }
    while(col>0&&col<7){const td=document.createElement('td');td.innerHTML='<span class="chip em">·</span>';row.appendChild(td);col++;}
    if(row.children.length)tbody.appendChild(row);
    tbl.appendChild(tbody);cal.appendChild(tbl);card.appendChild(cal);grid.appendChild(card);
  });
}

async function load(){
  const tMin=YEAR+'-01-01T00:00:00-03:00',tMax=YEAR+'-12-31T23:59:59-03:00';
  const url='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(CAL_ID)+'/events?key='+API_KEY+'&timeMin='+tMin+'&timeMax='+tMax+'&singleEvents=true&maxResults=250&fields=items(summary,start)';
  try{
    const res=await fetch(url);
    if(!res.ok)throw new Error(res.status);
    const data=await res.json();
    render(buildBookedMap(data.items));
  }catch(e){render(buildBookedMap(REAL_EVENTS));}
  setTimeout(load,600000);
}

// Auto-scale for TV
function fitScreen(){
  const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
  document.body.style.transform=`scale(${s})`;
  document.body.style.left=((window.innerWidth-1920*s)/2)+'px';
  document.body.style.top=((window.innerHeight-1080*s)/2)+'px';
}
fitScreen();window.addEventListener('resize',fitScreen);

render(buildBookedMap(REAL_EVENTS));
load();
</script>
